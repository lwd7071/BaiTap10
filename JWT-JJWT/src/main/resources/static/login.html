<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đăng nhập | JWT Demo</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="card"><div class="eyebrow">SPRING SECURITY · JWT</div><h1>Chào mừng trở lại</h1><p class="muted">Đăng nhập hoặc tạo tài khoản để truy cập hồ sơ.</p>
<form id="login-form"><label>Tên đăng nhập<input name="username" autocomplete="username" required></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label><button type="submit">Đăng nhập</button></form>
<div class="divider">hoặc</div><form id="register-form"><label>Tạo tài khoản mới<input name="username" placeholder="Tên đăng nhập" required></label><label>Mật khẩu mới<input name="password" type="password" minlength="6" placeholder="Ít nhất 6 ký tự" required></label><button class="secondary" type="submit">Đăng ký</button></form><p id="message" class="message" role="status"></p></main><script src="/js/mainjs.js"></script></body></html>
