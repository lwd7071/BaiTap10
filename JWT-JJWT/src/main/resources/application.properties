spring.application.name=JWT-JJWT
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [corr=%X{correlationId:-}] [%X{method:-} %X{path:-}] %logger{36} - %msg%n
server.port=${SERVER_PORT:8005}
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=jwt_springboot3;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:YourStrong!Passw0rd}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
security.jwt.secret-key=${JWT_SECRET:change-this-secret-key-to-a-random-value-at-least-32-bytes-long}
security.jwt.expiration-time=${JWT_EXPIRATION_MS:3600000}
